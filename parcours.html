<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon parcours — Julie Prévost, L'atelier de la rebouteuse</title><meta name="description" content="Infirmière depuis plus de 20 ans (urgences, chirurgie, soins généraux, rééducation), formée au reboutement, à la méthode Niromathé, à la TMC, aux soins énergétiques et au Reiki.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#f3efe6;--ink:#1f2a22;--soft:#4d5a50;--card:#fffdf8;--line:#d9d3c3;--green:#2f3f31;--clay:#b8643f;--on:#f3efe6}
@media (prefers-color-scheme:dark){:root{--bg:#1a221c;--ink:#ece8dc;--soft:#b3bcb2;--card:#232d25;--line:#38453a;--clay:#d98a64}}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.1;margin:0 0 .5em}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 22px}
nav{background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav .wrap{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;padding-top:12px;padding-bottom:12px;align-items:center}
nav a{text-decoration:none;font-size:15px;font-weight:500}
nav .brand{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;margin-right:auto}
.hero{background:radial-gradient(120% 80% at 70% 0,#4a5a47,var(--green) 60%,#1d2820);color:var(--on);text-align:center;padding:60px 0 52px}
.hero h1{font-size:clamp(40px,11vw,64px)}
.hero em{color:#e49a74}
.hero p{color:#d8dcd2;max-width:30em;margin:0 auto 26px}
.btn{display:inline-block;background:var(--on);color:#1f2a22;padding:15px 26px;border-radius:999px;text-decoration:none;font-weight:500}
section{padding:48px 0;border-bottom:1px solid var(--line)}
h2{font-size:clamp(32px,9vw,44px)}
h3{font-size:25px;margin-top:1.3em}
.lead{font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;line-height:1.4;color:var(--soft)}
ul{padding-left:20px}
li{margin-bottom:.3em}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:20px;font-size:15.5px;color:var(--soft)}
.cards{display:grid;gap:14px}
.cards a{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-decoration:none}
.cards b{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:500;display:block}
